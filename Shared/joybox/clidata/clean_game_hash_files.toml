# Help text for the clean_game_hash_files command, read by joybox/arguments.py

description = "Rewrite every game hash file with its entries in sorted order."
details = """
Reads each per-subcategory hash file under `Hashes/` in the game metadata repository
and writes it back with entries sorted by path and keys sorted within each entry, so
the files stay stable under version control.

Reading a file also adds any missing encrypted-field keys (`filename_enc`, `hash_enc`,
`size_enc`), and entries with the same directory and file name collapse into one."""
section = "Game Collection"
see_also = [
    "build_game_hash_files",
    "verify_game_files",
    "clean_game_json_files",
    "clean_game_metadata_files",
]
notes = [
    "There are no selection options; every hash file for every supercategory is processed.",
]
examples = [
    ["Sort every hash file", "clean_game_hash_files"],
    ["Sort without the confirmation prompt", "clean_game_hash_files --no-preview"],
    ["Show which files would be sorted", "clean_game_hash_files -p -v"],
]
