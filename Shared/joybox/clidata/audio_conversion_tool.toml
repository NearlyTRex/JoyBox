# Help text for the audio_conversion_tool command, read by joybox/arguments.py

description = "Convert Audible AAX and AA audiobooks to M4A."
details = """
The only action is `AaxToM4a`. It removes Audible's DRM with FFmpeg's
`-activation_bytes` and copies the streams unchanged (`-c copy`), so there is no
re-encoding and the chapters are kept.

The input may be one `.aax`/`.aa` file or a directory. For a file, the output is `-o`,
or the input path with an `.m4a` extension. For a directory, every `.aax`/`.aa` file
in it (and in its sub-directories with `-r`) is converted into `-o`, or into the input
directory itself, as `<name>.m4a`.

Without `-k`, the activation bytes are taken from the first of these that holds an
8-hex-digit value: `audible_activation_bytes` in `[UserData.Audible]` of the
configuration, the `-f` file, the `AUDIBLE_ACTIVATION_BYTES` environment variable, and
`~/.audible_authcode`."""
section = "Audio & Video"
see_also = [
    "audio_metadata_tool",
    "tag_audio_files",
    "generate_playlist",
]
notes = [
    "Without `--overwrite`, a book whose output already exists is skipped and counted as a success.",
    "Needs FFmpeg.",
]
examples = [
    ["Convert one book, finding the activation bytes automatically", "audio_conversion_tool -i \"/path/to/book.aax\""],
    ["Convert one book to a chosen file with explicit activation bytes", "audio_conversion_tool -i \"/path/to/book.aax\" -o \"/path/to/book.m4a\" -k 1a2b3c4d"],
    ["Convert every book in a directory", "audio_conversion_tool -i \"/path/to/audiobooks\""],
    ["Convert a directory tree, replacing earlier conversions", "audio_conversion_tool -i \"/path/to/audiobooks\" -r --overwrite"],
    ["Read the activation bytes from a file", "audio_conversion_tool -i \"/path/to/book.aax\" -f \"/path/to/authcode.txt\""],
    ["List what would be converted without running FFmpeg", "audio_conversion_tool -i \"/path/to/audiobooks\" -r -p -v"],
]
