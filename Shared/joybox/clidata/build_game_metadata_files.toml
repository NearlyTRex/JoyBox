# Help text for the build_game_metadata_files command, read by joybox/arguments.py

description = "Add each game with a JSON file to its platform's Pegasus metadata file and fill in missing details."
details = """
For each selected game that has a JSON file, makes sure the subcategory's metadata file
(`Pegasus/Roms/<category>/<subcategory>/metadata.pegasus.txt` in the metadata
repository) has an entry for it. A new entry records the platform, categories and JSON
file path, with `players` 1, `coop` No and `playable` Yes.

If the entry is then missing any downloadable field (description, genre, coop,
developer, publisher, players, release), the latest metadata is fetched and merged in:
from the store for store platforms, and from GameFAQs otherwise. Entries that already
have every downloadable field are left alone.

Only the `Roms` supercategory has metadata files; other supercategories are skipped."""
section = "Game Collection"
see_also = [
    "build_game_json_files",
    "build_game_store_purchases",
    "find_missing_game_metadata",
    "download_game_metadata_assets",
    "sort_game_metadata",
    "publish_game_metadata_files",
]
notes = [
    "Only games that already have a JSON file are processed; create it first with `build_game_json_files` or `build_game_store_purchases`.",
    "An existing entry is never recreated, only filled in.",
]
examples = [
    ["Build metadata for one game", "build_game_metadata_files -c Nintendo -s \"Nintendo Switch\" -n \"Pokemon Legends Z-A (World)\""],
    ["Build metadata for a whole platform", "build_game_metadata_files -c Sony -s \"Sony PlayStation 2\""],
    ["Build metadata for every game", "build_game_metadata_files"],
    ["Show what would be built", "build_game_metadata_files -c Computer -s Steam -p -v"],
]
