# Help text for the install_game_json command, read by joybox/arguments.py

description = "Install a game described by its JSON file into the local game cache."
details = """
The game is given either as a JSON file with `-i`, or by `-c`, `-s` and `-n`, which
name the JSON file under the `Roms` supercategory of the metadata repository.

A store game is installed with that store's own installer. Any other game is copied
from its remote ROM folder, decrypted, into its local cache folder, and first
transformed when its platform needs that (computer games, for example, are set up from
their installer files). A game that is already in the cache is left as it is.

With `-a`, the game's DLC and updates are then installed into the emulators that
handle its platform. Errors are shown as a popup and end the run."""
section = "Game Launching"
see_also = [
    "launch_game_json",
    "build_game_json_files",
]
examples = [
    ["Install a game from its JSON file", "install_game_json -i \"/path/to/Game Name (USA).json\""],
    ["Install a game with its DLC and updates", "install_game_json -i \"/path/to/Game Name (USA).json\" -a"],
    ["Install a computer game and keep its setup folder", "install_game_json -i \"/path/to/Game Name (USA).json\" -k"],
    ["Dry run", "install_game_json -i \"/path/to/Game Name (USA).json\" -p -v"],
]
