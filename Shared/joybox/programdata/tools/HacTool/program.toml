# HacTool: where its programs live and how they run, the files its setup writes
# and the system files it checks. Read by joybox/programcatalog.py.

[config.HacTool]
program = { windows = "HacTool/windows/hactool.exe", linux = "HacTool/linux/HacTool.AppImage" }
run_sandboxed = { windows = false, linux = false }

[[setup]]
kind = "github_release"
platform = "windows"
github_user = "SciresM"
github_repo = "hactool"
starts_with = "hactool"
ends_with = "win.zip"
search_file = "hactool.exe"
install_files = ["hactool.exe"]

[[setup]]
kind = "appimage_build"
platform = "linux"
release_url = "https://github.com/NearlyTRex/HacTool.git"
output_file = "App-x86_64.AppImage"
build_cmd = ["cp", "config.mk.template", "config.mk", "&&", "make", "-j", "4"]
internal_copies = [
    { from = "Source/HacTool/hactool", to = "AppImage/usr/bin/hactool" },
    { from = "AppImageTool/linux/app.desktop", to = "AppImage/app.desktop" },
    { from = "AppImageTool/linux/icon.svg", to = "AppImage/icon.svg" },
]
internal_symlinks = [{ from = "usr/bin/hactool", to = "AppRun" }]

[[setup_offline]]
kind = "stored_release"
platform = "windows"
search_file = "hactool.exe"
install_files = ["hactool.exe"]

[[setup_offline]]
kind = "stored_release"
platform = "linux"
