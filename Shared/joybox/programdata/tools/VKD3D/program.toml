# VKD3D: where its programs live and how they run, the files its setup writes
# and the system files it checks. Read by joybox/programcatalog.py.

[config.VKD3D]
lib32 = ["x86/d3d12.dll", "x86/d3d12core.dll"]
lib64 = ["x64/d3d12.dll", "x64/d3d12core.dll"]

[[setup]]
kind = "github_release"
platform = "lib"
for = "library"
github_user = "HansKristian-Work"
github_repo = "vkd3d-proton"
starts_with = "vkd3d-proton"
ends_with = ".tar.zst"
install_name = "VKD3D-Proton"

[[setup_offline]]
kind = "stored_release"
platform = "lib"
for = "library"
