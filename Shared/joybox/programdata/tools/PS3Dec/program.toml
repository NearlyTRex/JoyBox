# PS3Dec: where its programs live and how they run, the files its setup writes
# and the system files it checks. Read by joybox/programcatalog.py.

[config.PS3Dec]
program = { windows = "PS3Dec/windows/PS3Dec.exe", linux = "PS3Dec/linux/PS3Dec.AppImage" }
run_sandboxed = { windows = false, linux = false }

[[setup]]
kind = "github_release"
platform = "windows"
github_user = "NearlyTRex"
github_repo = "PS3Dec"
starts_with = "PS3Dec"
ends_with = ".zip"
search_file = "PS3Dec.exe"
install_files = ["PS3Dec.exe"]

[[setup]]
kind = "appimage_build"
platform = "linux"
release_url = "https://github.com/NearlyTRex/PS3Dec.git"
output_file = "App-x86_64.AppImage"
build_cmd = ["cmake", "-G", "Ninja", "..", "&&", "ninja"]
build_dir = "Build"
internal_copies = [
    { from = "Source/PS3Dec/Build/Release/PS3Dec", to = "AppImage/usr/bin/PS3Dec" },
    { from = "AppImageTool/linux/app.desktop", to = "AppImage/app.desktop" },
    { from = "AppImageTool/linux/icon.svg", to = "AppImage/icon.svg" },
]
internal_symlinks = [{ from = "usr/bin/PS3Dec", to = "AppRun" }]

[[setup_offline]]
kind = "stored_release"
platform = "windows"
search_file = "PS3Dec.exe"
install_files = ["PS3Dec.exe"]

[[setup_offline]]
kind = "stored_release"
platform = "linux"
