# Sunshine: where its programs live and how they run, the files its setup writes
# and the system files it checks. Read by joybox/programcatalog.py.

[config.Sunshine]
program = { windows = "Sunshine/windows/sunshine.exe", linux = "Sunshine/linux/Sunshine.AppImage" }
run_sandboxed = { windows = false, linux = false }

[[config_files]]
path = "Sunshine/windows/config/sunshine.conf"

[[config_files]]
path = "Sunshine/linux/Sunshine.AppImage.home/.config/sunshine/sunshine.conf"

[[config_files]]
path = "Sunshine/windows/config/apps.json"

[[config_files]]
path = "Sunshine/linux/Sunshine.AppImage.home/.config/sunshine/apps.json"

[[setup]]
kind = "github_release"
platform = "windows"
github_user = "LizardByte"
github_repo = "Sunshine"
starts_with = "sunshine"
ends_with = "windows.zip"
search_file = "sunshine.exe"
install_files = ["sunshine.exe", "assets", "scripts", "tools"]

[[setup]]
kind = "github_release"
platform = "linux"
github_user = "LizardByte"
github_repo = "Sunshine"
starts_with = "sunshine"
ends_with = ".AppImage"
search_file = "Sunshine.AppImage"

[[setup_offline]]
kind = "stored_release"
platform = "windows"
search_file = "sunshine.exe"
install_files = ["sunshine.exe", "assets", "scripts", "tools"]

[[setup_offline]]
kind = "stored_release"
platform = "linux"
search_file = "Sunshine.AppImage"

[launch]
args = []
