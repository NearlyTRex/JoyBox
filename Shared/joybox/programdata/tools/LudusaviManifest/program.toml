# LudusaviManifest: where its programs live and how they run, the files its setup writes
# and the system files it checks. Read by joybox/programcatalog.py.

[config.LudusaviManifest]
yaml = "LudusaviManifest/lib/data/manifest.yaml"

[[setup]]
kind = "github_repository"
platform = "lib"
for = "library"
github_user = "NearlyTRex"
github_repo = "LudusaviManifest"
github_branch = "{program_config:github_branch}"
clean = true

[[setup]]
kind = "github_archive"
platform = "lib"
for = "library"
github_user = "NearlyTRex"
github_repo = "LudusaviManifest"
github_branch = "{program_config:github_branch}"
recursive = true
clean = true

[[setup_offline]]
kind = "stored_release"
platform = "lib"
for = "library"
