# Ludusavi: where its programs live and how they run, the files its setup writes
# and the system files it checks. Read by joybox/programcatalog.py.

[config.Ludusavi]
program = { windows = "Ludusavi/windows/ludusavi.exe", linux = "Ludusavi/linux/ludusavi" }
run_sandboxed = { windows = false, linux = false }

[[config_files]]
path = "Ludusavi/windows/ludusavi.portable"

[[config_files]]
path = "Ludusavi/windows/config.yaml"
template = "config.yaml"

[[config_files]]
path = "Ludusavi/linux/ludusavi.portable"

[[config_files]]
path = "Ludusavi/linux/config.yaml"
template = "linux-config.yaml"

[[setup]]
kind = "github_release"
platform = "windows"
github_user = "mtkennerly"
github_repo = "ludusavi"
starts_with = "ludusavi"
ends_with = "win64.zip"
search_file = "ludusavi.exe"
install_files = ["ludusavi.exe"]

[[setup]]
kind = "github_release"
platform = "linux"
github_user = "mtkennerly"
github_repo = "ludusavi"
starts_with = "ludusavi"
ends_with = "linux.zip"
search_file = "ludusavi"
install_files = ["ludusavi"]
chmod_files = [{ file = "ludusavi", perms = 755 }]

[[setup_offline]]
kind = "stored_release"
platform = "windows"
search_file = "ludusavi.exe"
install_files = ["ludusavi.exe"]

[[setup_offline]]
kind = "stored_release"
platform = "linux"
search_file = "ludusavi"
install_files = ["ludusavi"]
chmod_files = [{ file = "ludusavi", perms = 755 }]
