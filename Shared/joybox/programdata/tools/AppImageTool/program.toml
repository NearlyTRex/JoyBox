# AppImageTool: where its programs live and how they run, the files its setup writes
# and the system files it checks. Read by joybox/programcatalog.py.

[config.AppImageTool]
program = { windows = "<none>", linux = "AppImageTool/linux/AppImageTool.AppImage" }
run_sandboxed = { windows = false, linux = false }

[[config_files]]
path = "AppImageTool/linux/app.desktop"
template = "app.desktop"

[[setup]]
kind = "github_release"
platform = "linux"
github_user = "AppImage"
github_repo = "AppImageKit"
starts_with = "appimagetool-x86_64"
ends_with = ".AppImage"
search_file = "AppImageTool.AppImage"

[[setup_offline]]
kind = "stored_release"
platform = "linux"
search_file = "AppImageTool.AppImage"
