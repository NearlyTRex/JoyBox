# RClone: where its programs live and how they run, the files its setup writes
# and the system files it checks. Read by joybox/programcatalog.py.

[config.RClone]
program = { windows = "RClone/windows/rclone.exe", linux = "RClone/linux/rclone" }
config_file = { windows = "RClone/windows/rclone.conf", linux = "RClone/linux/rclone.conf" }
cache_dir = { windows = "RClone/windows/cache", linux = "RClone/linux/cache" }
run_sandboxed = { windows = false, linux = false }

[[setup]]
kind = "general_release"
platform = "windows"
archive_url = "https://downloads.rclone.org/rclone-current-windows-amd64.zip"
search_file = "rclone.exe"

[[setup]]
kind = "general_release"
platform = "linux"
archive_url = "https://downloads.rclone.org/rclone-current-linux-amd64.zip"
search_file = "rclone"

[[setup_offline]]
kind = "stored_release"
platform = "windows"
search_file = "rclone.exe"

[[setup_offline]]
kind = "stored_release"
platform = "linux"
search_file = "rclone"
