# Sigtop: where its programs live and how they run, the files its setup writes
# and the system files it checks. Read by joybox/programcatalog.py.

[config.Sigtop]
program = { windows = "Sigtop/windows/sigtop.exe", linux = "Sigtop/windows/sigtop.exe" }
run_sandboxed = { windows = false, linux = true }

[[setup]]
kind = "github_release"
platform = "windows"
github_user = "tbvdm"
github_repo = "sigtop"
starts_with = "sigtop"
ends_with = ".exe"
search_file = "sigtop.exe"
install_files = ["sigtop.exe"]

[[setup_offline]]
kind = "stored_release"
platform = "windows"
search_file = "sigtop.exe"
install_files = ["sigtop.exe"]
