# melonDS: where its programs live and how they run, the files its setup writes
# and the system files it checks. Read by joybox/programcatalog.py.

# The platforms it plays
platforms = ["NINTENDO_DS", "NINTENDO_DSI"]

[config.melonDS]
program = { windows = "melonDS/windows/melonDS.exe", linux = "melonDS/linux/melonDS.AppImage" }
save_dir = { windows = "<none>", linux = "<none>" }
setup_dir = { windows = "melonDS/windows", linux = "melonDS/linux/melonDS.AppImage.home/.config/melonDS" }
run_sandboxed = { windows = false, linux = false }

[config.melonDS.config_file]
windows = "melonDS/windows/melonDS.ini"
linux = "melonDS/linux/melonDS.AppImage.home/.config/melonDS/melonDS.ini"

[[config_files]]
path = "melonDS/windows/melonDS.ini"
template = "melonDS.ini"

[[config_files]]
path = "melonDS/linux/melonDS.AppImage.home/.config/melonDS/melonDS.ini"
template = "melonDS.ini"

[[system_files]]
path = "sysdata/nds_firmware_usa.bin"
md5 = "10ec0b038afe62b6edf5d098615c8039"

[[system_files]]
path = "sysdata/dsi_arm7_usa.bin"
md5 = "559dae4ea78eb9d67702c56c1d791e81"

[[system_files]]
path = "sysdata/dsi_arm9_usa.bin"
md5 = "87b665fce118f76251271c3732532777"

[[system_files]]
path = "sysdata/nds_arm7_usa.bin"
md5 = "df692a80a5b1bc90728bc3dfc76cd948"

[[system_files]]
path = "sysdata/dsi_firmware_usa.bin"
md5 = "74f23348012d7b3e1cc216c47192ffeb"

[[system_files]]
path = "sysdata/nds_arm9_usa.bin"
md5 = "a392174eb3e572fed6447e956bde4b25"

[[system_files]]
path = "nds_key_world.cfg"
md5 = "c65df953c21897b85ebc8eefbba3c22f"

[[system_files]]
path = "nand/dsi_nand_usa.bin"
md5 = "d9c875ded95daed312016f5c77f84db1"

[[setup]]
kind = "github_release"
platform = "windows"
github_user = "melonDS-emu"
github_repo = "melonDS"
starts_with = "melonDS"
ends_with = "windows-x86_64.zip"
search_file = "melonDS.exe"
get_latest = true

[[setup]]
kind = "appimage_build"
platform = "linux"
release_url = "https://github.com/NearlyTRex/melonDS.git"
output_file = "melonDS-x86_64.AppImage"
build_cmd = ["cmake", "..", "-DCMAKE_BUILD_TYPE=Release", "&&", "make", "-j", "4"]
build_dir = "Build"
internal_copies = [
    { from = "Source/melonDS/Build/melonDS", to = "AppImage/usr/bin/melonDS" },
    { from = "Source/melonDS/res/net.kuribo64.melonDS.desktop", to = "AppImage/net.kuribo64.melonDS.desktop" },
    { from = "Source/melonDS/res/icon/melon_256x256.png", to = "AppImage/net.kuribo64.melonDS.png" },
]
internal_symlinks = [{ from = "usr/bin/melonDS", to = "AppRun" }]

[[setup_offline]]
kind = "stored_release"
platform = "windows"
search_file = "melonDS.exe"

[[setup_offline]]
kind = "stored_release"
platform = "linux"
