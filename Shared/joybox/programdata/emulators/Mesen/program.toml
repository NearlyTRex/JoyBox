# Mesen: where its programs live and how they run, the files its setup writes
# and the system files it checks. Read by joybox/programcatalog.py.

[config.Mesen]
program = { windows = "Mesen/windows/Mesen.exe", linux = "Mesen/linux/Mesen.AppImage" }
run_sandboxed = { windows = false, linux = false }

[[setup]]
kind = "github_release"
platform = "windows"
github_user = "nesdev-org"
github_repo = "MesenCE"
starts_with = "Mesen"
ends_with = "_Windows.zip"
search_file = "Mesen.exe"
get_latest = true

[[setup]]
kind = "appimage_build"
platform = "linux"
release_url = "https://github.com/NearlyTRex/Mesen.git"
output_file = "Mesen-x86_64.AppImage"
build_cmd = [
    "export",
    "PUBLISHFLAGS=-r linux-x64 --no-self-contained false -p:PublishSingleFile=true -p:PublishReadyToRun=true",
    "&&",
    "make",
    "-j",
    "4",
    "-O",
    "LTO=true",
    "STATICLINK=true",
    "SYSTEM_LIBEVDEV=false",
]
internal_copies = [
    { from = "Source/Mesen/bin/linux-x64/Release/linux-x64/publish/Mesen", to = "AppImage/usr/bin/Mesen" },
    { from = "Source/Mesen/Linux/appimage/Mesen.desktop", to = "AppImage/Mesen.desktop" },
    { from = "Source/Mesen/Linux/appimage/Mesen.48x48.png", to = "AppImage/Mesen.png" },
]
internal_symlinks = [{ from = "usr/bin/Mesen", to = "AppRun" }]

[[setup_offline]]
kind = "stored_release"
platform = "windows"
search_file = "Mesen.exe"

[[setup_offline]]
kind = "stored_release"
platform = "linux"
search_file = "Mesen.AppImage"
