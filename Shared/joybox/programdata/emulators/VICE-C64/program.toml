# VICE-C64: where its programs live and how they run, the files its setup writes
# and the system files it checks. Read by joybox/programcatalog.py.

# The platforms it plays
platforms = ["OTHER_COMMODORE_64"]

[config.VICE-C64]
program = { windows = "VICE-C64/windows/x64sc.exe", linux = "VICE-C64/linux/VICE-C64.AppImage" }
save_dir = { windows = "<none>", linux = "<none>" }
run_sandboxed = { windows = false, linux = false }

[config.VICE-C64.config_file]
windows = "VICE-C64/windows/sdl-vice.ini"
linux = "VICE-C64/linux/VICE-C64.AppImage.home/.config/vice/vicerc"

[[config_files]]
path = "VICE-C64/windows/sdl-vice.ini"

[[config_files]]
path = "VICE-C64/linux/VICE-C64.AppImage.home/.config/vice/vicerc"

[[setup]]
kind = "github_release"
platform = "windows"
github_user = "VICE-Team"
github_repo = "svn-mirror"
starts_with = "SDL2VICE"
ends_with = "win64.zip"
search_file = "x64sc.exe"
get_latest = true

[[setup]]
kind = "appimage_build"
platform = "linux"
release_url = "https://github.com/NearlyTRex/ViceC64.git"
output_file = "App-x86_64.AppImage"
build_cmd = [
    "cd",
    "vice",
    "&&",
    "./autogen.sh",
    "&&",
    "./configure",
    "--disable-html-docs",
    "--enable-pdf-docs=no",
    "&&",
    "make",
    "-j",
    "4",
]
internal_copies = [
    { from = "Source/ViceC64/vice/data", to = "AppImage/usr/bin" },
    { from = "Source/ViceC64/vice/src/x64sc", to = "AppImage/usr/bin/x64sc" },
    { from = "AppImageTool/linux/app.desktop", to = "AppImage/app.desktop" },
    { from = "AppImageTool/linux/icon.svg", to = "AppImage/icon.svg" },
]
internal_symlinks = [{ from = "usr/bin/x64sc", to = "AppRun" }]

[[setup_offline]]
kind = "stored_release"
platform = "windows"
search_file = "x64sc.exe"

[[setup_offline]]
kind = "stored_release"
platform = "linux"
