# Ares: where its programs live and how they run, the files its setup writes
# and the system files it checks. Read by joybox/programcatalog.py.

[config.Ares]
program = { windows = "Ares/windows/ares.exe", linux = "Ares/linux/Ares.AppImage" }
save_dir = { windows = "<none>", linux = "<none>" }
save_base_dir = { windows = "Ares/windows/Saves", linux = "Ares/linux/Ares.AppImage.home/.local/share/ares/Saves" }
setup_dir = { windows = "Ares/windows", linux = "Ares/linux/Ares.AppImage.home/.local/share/ares" }
run_sandboxed = { windows = false, linux = false }

