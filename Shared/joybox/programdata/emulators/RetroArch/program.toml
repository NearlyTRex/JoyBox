# RetroArch: where its programs live and how they run, the files its setup writes
# and the system files it checks. Read by joybox/programcatalog.py.

[config.RetroArch]
save_sub_dirs = { "Panasonic 3DO" = "opera/per_game" }
cores_ext = { windows = ".dll", linux = ".so" }
cores_mapping = { "Panasonic 3DO" = "opera_libretro", "Sega Saturn" = "mednafen_saturn_libretro" }
run_sandboxed = { windows = false, linux = false }

[config.RetroArch.program]
windows = "RetroArch/windows/retroarch.exe"
linux = "RetroArch/linux/RetroArch-Linux-x86_64.AppImage"

[config.RetroArch.save_dir]
windows = "RetroArch/windows/saves"
linux = "RetroArch/linux/RetroArch-Linux-x86_64.AppImage.home/.config/retroarch/saves"

[config.RetroArch.save_base_dir]
windows = "RetroArch/windows/saves"
linux = "RetroArch/linux/RetroArch-Linux-x86_64.AppImage.home/.config/retroarch/saves"

[config.RetroArch.setup_dir]
windows = "RetroArch/windows"
linux = "RetroArch/linux/RetroArch-Linux-x86_64.AppImage.home/.config/retroarch"

[config.RetroArch.cores_dir]
windows = "RetroArch/windows/cores"
linux = "RetroArch/linux/RetroArch-Linux-x86_64.AppImage.home/.config/retroarch/cores"

[config.RetroArch.config_file]
windows = "RetroArch/windows/retroarch.cfg"
linux = "RetroArch/linux/RetroArch-Linux-x86_64.AppImage.home/.config/retroarch/retroarch.cfg"

[[config_files]]
path = "RetroArch/windows/retroarch.cfg"

[[config_files]]
path = "RetroArch/linux/RetroArch-Linux-x86_64.AppImage.home/.config/retroarch/retroarch.cfg"

