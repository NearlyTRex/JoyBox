# Mednafen: where its programs live and how they run, the files its setup writes
# and the system files it checks. Read by joybox/programcatalog.py.

# The platforms it plays
platforms = ["NINTENDO_VIRTUAL_BOY", "OTHER_ATARI_LYNX"]

[config.Mednafen]
program = { windows = "Mednafen/windows/mednafen.exe", linux = "Mednafen/linux/Mednafen.AppImage" }
save_dir = { windows = "Mednafen/windows/sav", linux = "Mednafen/linux/Mednafen.AppImage.home/.mednafen/sav" }
setup_dir = { windows = "Mednafen/windows", linux = "Mednafen/linux/Mednafen.AppImage.home/.mednafen" }
run_sandboxed = { windows = false, linux = false }

[config.Mednafen.config_file]
windows = "Mednafen/windows/mednafen.cfg"
linux = "Mednafen/linux/Mednafen.AppImage.home/.mednafen/mednafen.cfg"

[[config_files]]
path = "Mednafen/windows/mednafen.cfg"

[[config_files]]
path = "Mednafen/linux/Mednafen.AppImage.home/.mednafen/mednafen.cfg"

[[system_files]]
path = "firmware/lynxboot.img"
md5 = "fcd403db69f54290b51035d82f835e7b"

[[setup]]
kind = "webpage_release"
platform = "windows"
webpage_url = "https://mednafen.github.io"
webpage_base_url = "https://mednafen.github.io"
starts_with = "https://mednafen.github.io/releases/files/mednafen"
ends_with = "UNSTABLE-win64.zip"
search_file = "mednafen.exe"
get_latest = true

[[setup]]
kind = "appimage_build"
platform = "linux"
release_url = "https://github.com/NearlyTRex/Mednafen.git"
output_file = "App-x86_64.AppImage"
build_cmd = ["./configure", "&&", "make", "-j", "4"]
internal_copies = [
    { from = "Source/Mednafen/src/mednafen", to = "AppImage/usr/bin/mednafen" },
    { from = "AppImageTool/linux/app.desktop", to = "AppImage/app.desktop" },
    { from = "AppImageTool/linux/icon.svg", to = "AppImage/icon.svg" },
]
internal_symlinks = [{ from = "usr/bin/mednafen", to = "AppRun" }]

[[setup_offline]]
kind = "stored_release"
platform = "windows"
search_file = "mednafen.exe"

[[setup_offline]]
kind = "stored_release"
platform = "linux"
