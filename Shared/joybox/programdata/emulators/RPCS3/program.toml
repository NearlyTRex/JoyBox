# RPCS3: where its programs live and how they run, the files its setup writes
# and the system files it checks. Read by joybox/programcatalog.py.

# The platforms it plays
platforms = ["SONY_PLAYSTATION_3", "SONY_PLAYSTATION_NETWORK_PS3"]

[config.RPCS3]
program = { windows = "RPCS3/windows/rpcs3.exe", linux = "RPCS3/linux/RPCS3.AppImage" }
setup_dir = { windows = "RPCS3/windows", linux = "RPCS3/linux/RPCS3.AppImage.home/.config/rpcs3" }
run_sandboxed = { windows = false, linux = false }

[config.RPCS3.save_dir]
windows = "RPCS3/windows/dev_hdd0/home/00000001"
linux = "RPCS3/linux/RPCS3.AppImage.home/.config/rpcs3/dev_hdd0/home/00000001"

[config.RPCS3.config_file]
windows = "RPCS3/windows/GuiConfigs/CurrentSettings.ini"
linux = "RPCS3/linux/RPCS3.AppImage.home/.config/rpcs3/GuiConfigs/CurrentSettings.ini"

[[config_files]]
path = "RPCS3/windows/GuiConfigs/CurrentSettings.ini"

[[config_files]]
path = "RPCS3/linux/RPCS3.AppImage.home/.config/rpcs3/GuiConfigs/CurrentSettings.ini"

[[system_files]]
path = "dev_flash.zip"
md5 = "08f2dc11bd3c7dfefae48ebbbc8caf55"

[[setup]]
kind = "github_release"
platform = "windows"
github_user = "RPCS3"
github_repo = "rpcs3-binaries-win"
starts_with = "rpcs3"
ends_with = "win64_msvc.7z"
search_file = "rpcs3.exe"
get_latest = true

[[setup]]
kind = "github_release"
platform = "linux"
github_user = "RPCS3"
github_repo = "rpcs3-binaries-linux"
starts_with = "rpcs3"
ends_with = ".AppImage"
get_latest = true

[[setup_offline]]
kind = "stored_release"
platform = "windows"
search_file = "rpcs3.exe"

[[setup_offline]]
kind = "stored_release"
platform = "linux"

[launch]
args = ["{game_file}"]
fullscreen_args = ["--fullscreen", "--no-gui"]
