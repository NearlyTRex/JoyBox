# PCSX2: where its programs live and how they run, the files its setup writes
# and the system files it checks. Read by joybox/programcatalog.py.

[config.PCSX2]
program = { windows = "PCSX2/windows/pcsx2-qt.exe", linux = "PCSX2/linux/PCSX2.AppImage" }
setup_dir = { windows = "PCSX2/windows", linux = "PCSX2/linux/PCSX2.AppImage.home/.config/PCSX2" }
run_sandboxed = { windows = false, linux = false }

[config.PCSX2.save_dir]
windows = "PCSX2/windows/memcards"
linux = "PCSX2/linux/PCSX2.AppImage.home/.config/PCSX2/memcards"

[config.PCSX2.config_file]
windows = "PCSX2/windows/inis/PCSX2.ini"
linux = "PCSX2/linux/PCSX2.AppImage.home/.config/PCSX2/inis/PCSX2.ini"

[[config_files]]
path = "PCSX2/windows/portable.ini"

[[config_files]]
path = "PCSX2/windows/inis/PCSX2.ini"
template = "PCSX2.ini"

[[config_files]]
path = "PCSX2/linux/PCSX2.AppImage.home/.config/PCSX2/inis/PCSX2.ini"
template = "PCSX2.ini"

