# Dolphin: where its programs live and how they run, the files its setup writes
# and the system files it checks. Read by joybox/programcatalog.py.

# The platforms it plays
platforms = ["NINTENDO_GAMECUBE", "NINTENDO_WII", "NINTENDO_WIIWARE"]

[config.Dolphin]
program = { windows = "Dolphin/windows/Dolphin.exe", linux = "Dolphin/linux/Dolphin.AppImage" }
save_dir = { windows = "<none>", linux = "<none>" }
run_sandboxed = { windows = false, linux = false }

[config.Dolphin.save_base_dir]
windows = "Dolphin/windows/User"
linux = "Dolphin/linux/Dolphin.AppImage.home/.local/share/dolphin-emu"

[config.Dolphin.save_sub_dirs]
"Nintendo Gamecube" = "GC"
"Nintendo Wii" = "Wii/title/00010000"
"Nintendo WiiWare" = "Wii/title/00010001"

[config.Dolphin.setup_dir]
windows = "Dolphin/windows/User"
linux = "Dolphin/linux/Dolphin.AppImage.home/.local/share/dolphin-emu"

[config.Dolphin.config_file]
windows = "Dolphin/windows/User/Config/Dolphin.ini"
linux = "Dolphin/linux/Dolphin.AppImage.home/.config/dolphin-emu/Dolphin.ini"

[[config_files]]
path = "Dolphin/windows/portable.txt"

[[config_files]]
path = "Dolphin/windows/User/Config/Dolphin.ini"

[[config_files]]
path = "Dolphin/linux/Dolphin.AppImage.home/.config/dolphin-emu/Dolphin.ini"
template = "Dolphin.ini"

[[config_files]]
path = "Dolphin/linux/Dolphin.AppImage.home/.config/dolphin-emu/GCPadNew.ini"
template = "GCPadNew.ini"

[[config_files]]
path = "Dolphin/linux/Dolphin.AppImage.home/.config/dolphin-emu/GBA.ini"
template = "GBA.ini"

[[system_files]]
path = "Wii.zip"
md5 = "2029efb1ed06ef0cb3679537b803d9ab"
