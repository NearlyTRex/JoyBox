# Vita3K: where its programs live and how they run, the files its setup writes
# and the system files it checks. Read by joybox/programcatalog.py.

# The platforms it plays
platforms = ["SONY_PLAYSTATION_NETWORK_PSV", "SONY_PLAYSTATION_VITA"]

[config.Vita3K]
program = { windows = "Vita3K/windows/Vita3K.exe", linux = "Vita3K/linux/Vita3K.AppImage" }
run_sandboxed = { windows = false, linux = false }

[config.Vita3K.save_dir]
windows = "Vita3K/windows/data/ux0/user"
linux = "Vita3K/linux/Vita3K.AppImage.home/.local/share/Vita3K/Vita3K/ux0/user"

[config.Vita3K.app_dir]
windows = "Vita3K/windows/data/ux0/app"
linux = "Vita3K/linux/Vita3K.AppImage.home/.local/share/Vita3K/Vita3K/ux0/app"

[config.Vita3K.setup_dir]
windows = "Vita3K/windows/data"
linux = "Vita3K/linux/Vita3K.AppImage.home/.local/share/Vita3K/Vita3K"

[config.Vita3K.config_file]
windows = "Vita3K/windows/config.yml"
linux = "Vita3K/linux/Vita3K.AppImage.home/.config/Vita3K/config.yml"

[[config_files]]
path = "Vita3K/windows/config.yml"
template = "config.yml"

[[config_files]]
path = "Vita3K/linux/Vita3K.AppImage.home/.config/Vita3K/config.yml"
template = "config.yml"

[[system_files]]
path = "vs0.zip"
md5 = "f3c4ec664b6a2cba130eb5b3977dbc23"

[[system_files]]
path = "os0.zip"
md5 = "301589989b48da90e6db41b85d2b0acc"

[[system_files]]
path = "sa0.zip"
md5 = "c248704ab44184c7c47f9bcc27854696"
