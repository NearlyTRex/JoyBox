# PCEm: where its programs live and how they run, the files its setup writes
# and the system files it checks. Read by joybox/programcatalog.py.

[config.PCEm]
program = { windows = "PCEm/windows/PCem.exe", linux = "PCEm/windows/PCem.exe" }
run_sandboxed = { windows = false, linux = true }

[[setup]]
kind = "github_release"
platform = "windows"
github_user = "sarah-walker-pcem"
github_repo = "pcem"
starts_with = "PCem"
ends_with = "Win.zip"
search_file = "PCem.exe"

[[setup_offline]]
kind = "stored_release"
platform = "windows"
search_file = "PCem.exe"
