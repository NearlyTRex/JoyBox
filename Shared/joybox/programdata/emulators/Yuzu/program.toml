# Yuzu: where its programs live and how they run, the files its setup writes
# and the system files it checks. Read by joybox/programcatalog.py.

# The platforms it plays
platforms = ["NINTENDO_SWITCH", "NINTENDO_SWITCH_ESHOP"]

[config.Yuzu]
program = { windows = "Yuzu/windows/yuzu.exe", linux = "Yuzu/linux/Yuzu.AppImage" }
setup_dir = { windows = "Yuzu/windows/user", linux = "Yuzu/linux/Yuzu.AppImage.home/.local/share/yuzu" }
profile_user_id = "{switch_profile_user_id}"
profile_account_name = "{switch_profile_account_name}"
run_sandboxed = { windows = false, linux = false }

[config.Yuzu.save_dir]
windows = "Yuzu/windows/user/nand/user/save/0000000000000000/{switch_profile_user_id}"
linux = "Yuzu/linux/Yuzu.AppImage.home/.local/share/yuzu/nand/user/save/0000000000000000/{switch_profile_user_id}"

[config.Yuzu.config_file]
windows = "Yuzu/windows/user/config/qt-config.ini"
linux = "Yuzu/linux/Yuzu.AppImage.home/.config/yuzu/qt-config.ini"

[config.Yuzu.profiles_file]
windows = "Yuzu/windows/user/nand/system/save/8000000000000010/su/avators/profiles.dat"
linux = "Yuzu/linux/Yuzu.AppImage.home/.local/share/yuzu/nand/system/save/8000000000000010/su/avators/profiles.dat"

[[config_files]]
path = "Yuzu/windows/user/config/qt-config.ini"
template = "qt-config.ini"

[[config_files]]
path = "Yuzu/linux/Yuzu.AppImage.home/.config/yuzu/qt-config.ini"
template = "qt-config.ini"

