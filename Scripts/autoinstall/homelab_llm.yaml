# GPU LLM server
#
# Merged into the generated autoinstall document:
#   build_autoinstall_iso -y Scripts/autoinstall/homelab_llm.yaml -t llm
#
# Lists here are added to what the build already produced, so the account, the
# disk layout and the packages from JoyBox.ini all survive the merge.

autoinstall:

  # The NVIDIA driver is named rather than left to subiquity's detection, which
  # picks the newest branch and its open kernel modules. Those only drive
  # Turing and later, and 580 is the last branch to drive Volta at all, so a
  # V100 needs 580-server with the closed modules. The archive builds are
  # signed and load with Secure Boot on. nvidia-utils is what puts nvidia-smi
  # on the machine, and without it the ollama installer adds NVIDIA's own DKMS
  # driver on top.
  packages:
    - nvidia-headless-no-dkms-580-server
    - linux-modules-nvidia-580-server-generic
    - nvidia-utils-580-server
    - curl
    - ca-certificates
    - pciutils
    - ufw
    - build-essential
    - python3-pip
    - python3-venv
    - git
    - nvtop
    - btop
    - tmux
    - unattended-upgrades

  # ollama is installed on first boot rather than in a late command. Its
  # installer talks to a running systemd, which the installer chroot does not
  # have, so running it there leaves the service unstarted at best.
  user-data:

    write_files:

      # The API listens on localhost until told otherwise, which is no use to
      # anything else on the network. Everything that can reach the port can
      # use the models, so keep the port off the open internet. A loaded model
      # stays loaded until a request for another needs its room, since loading
      # one is slow and the machine has nothing else to use the VRAM for.
      - path: /etc/systemd/system/ollama.service.d/override.conf
        permissions: '0644'
        content: |
          [Service]
          StateDirectory=ollama
          ExecStartPre=+/usr/local/sbin/ollama-helper select
          EnvironmentFile=-/run/ollama/gpus.env
          Environment="OLLAMA_HOST=0.0.0.0:11434"
          Environment="OLLAMA_MODELS=/var/lib/ollama/models"
          Environment="OLLAMA_KEEP_ALIVE=-1"
          Environment="OLLAMA_NUM_PARALLEL=2"
          Environment="OLLAMA_MAX_LOADED_MODELS=2"

      # Reports what the card is actually doing, which is the first thing worth
      # knowing when a model answers slower than it should.
      - path: /usr/local/bin/gpu-status
        permissions: '0755'
        content: |
          #!/bin/sh
          nvidia-smi --query-gpu=name,driver_version,memory.used,memory.total,utilization.gpu \
            --format=csv 2>/dev/null || echo "No NVIDIA GPU visible to the driver"
          echo
          systemctl --no-pager --lines=0 status ollama 2>/dev/null | head -n 3
          ollama list 2>/dev/null

      # Picks the GPUs ollama computes on each time it starts (every card but
      # the one driving the display, so added cards are used after a reboot),
      # and reports the server's GPUs and RAM on port 11435 for clients sizing
      # models, which ollama's own API does not. Kept in the tree beside this
      # file as ollama_helper.py, where it is tested.
      - path: /usr/local/sbin/ollama-helper
        permissions: '0755'
        content: |
          #!/usr/bin/env python3
          #
          # Runs on the LLM server beside ollama, for what its API does not cover.
          #
          #   ollama-helper select   write the GPU choice for ollama's next start
          #   ollama-helper serve    answer GET /hardware with the server's GPUs and RAM
          #
          # Only the standard library is used, since this runs on a bare server.

          # Imports
          import http.server
          import json
          import os
          import subprocess
          import sys

          # Where ollama's unit reads the GPU choice from
          GPU_ENV_FILE = "/run/ollama/gpus.env"

          # Port the hardware report is served on, beside ollama's 11434
          HELPER_PORT = 11435

          ###########################################################
          # GPUs
          ###########################################################

          # Fields read from nvidia-smi, in order
          GPU_FIELDS = ["index", "uuid", "name", "pci.bus_id", "memory.total", "memory.free"]

          # Parse nvidia-smi's csv rows into GPU entries
          def parse_gpus(csv_text):
              gpus = []
              for line in csv_text.splitlines():
                  parts = [part.strip() for part in line.split(",")]
                  if len(parts) != len(GPU_FIELDS):
                      continue
                  index, uuid, name, bus_id, total, free = parts
                  try:
                      gpus.append({
                          "index": int(index),
                          "uuid": uuid,
                          "name": name,
                          "bus_id": bus_id,
                          "vram_total_mb": int(total),
                          "vram_free_mb": int(free),
                      })
                  except ValueError:
                      continue
              return gpus

          # Convert nvidia-smi's bus id to the sysfs device name
          # nvidia-smi prints an eight digit domain, sysfs a four digit one.
          def sysfs_device_name(bus_id):
              return bus_id.lower()[-12:]

          # Check whether the firmware drew the console on this card
          def is_boot_vga(bus_id, sysfs_root = "/sys/bus/pci/devices"):
              try:
                  with open(os.path.join(sysfs_root, sysfs_device_name(bus_id), "boot_vga")) as handle:
                      return handle.read().strip() == "1"
              except OSError:
                  return False

          # Read the GPUs, marking the display card
          def read_gpus(run = subprocess.run, sysfs_root = "/sys/bus/pci/devices"):
              try:
                  result = run(
                      ["nvidia-smi", "--query-gpu=%s" % ",".join(GPU_FIELDS), "--format=csv,noheader,nounits"],
                      capture_output = True, text = True, timeout = 30)
              except (OSError, subprocess.SubprocessError):
                  return []
              if result.returncode != 0:
                  return []
              gpus = parse_gpus(result.stdout)
              for gpu in gpus:
                  gpu["display"] = is_boot_vga(gpu["bus_id"], sysfs_root)
              return gpus

          # Choose the GPUs ollama computes on
          # Every card but the one driving the display, so a card added later is used
          # without anything being edited. A machine whose only card is the display one
          # still uses it.
          def compute_gpus(gpus):
              chosen = [gpu for gpu in gpus if not gpu.get("display")]
              return chosen or list(gpus)

          ###########################################################
          # Memory
          ###########################################################

          # Read total and available RAM from /proc/meminfo, in megabytes
          def read_ram(meminfo_file = "/proc/meminfo"):
              values = {}
              try:
                  with open(meminfo_file) as handle:
                      for line in handle:
                          key, _, rest = line.partition(":")
                          fields = rest.split()
                          if fields and fields[0].isdigit():
                              values[key.strip()] = int(fields[0]) // 1024
              except OSError:
                  pass
              return values.get("MemTotal", 0), values.get("MemAvailable", 0)

          ###########################################################
          # Commands
          ###########################################################

          # Build the environment file that points ollama at the chosen GPUs
          def build_gpu_env(gpus):
              chosen = compute_gpus(gpus)
              if not chosen:
                  return ""
              return "CUDA_VISIBLE_DEVICES=%s\n" % ",".join(gpu["uuid"] for gpu in chosen)

          # Write the GPU choice where ollama's unit reads it
          def select(gpus, env_file = GPU_ENV_FILE):
              os.makedirs(os.path.dirname(env_file), exist_ok = True)
              with open(env_file, "w") as handle:
                  handle.write(build_gpu_env(gpus))
              return True

          # Build the hardware report
          def build_report(gpus, ram_total_mb, ram_available_mb):
              chosen = compute_gpus(gpus)
              chosen_uuids = {gpu["uuid"] for gpu in chosen}
              return {
                  "gpus": [dict(gpu, compute = gpu["uuid"] in chosen_uuids) for gpu in gpus],
                  "compute_vram_total_mb": sum(gpu["vram_total_mb"] for gpu in chosen),
                  "compute_vram_free_mb": sum(gpu["vram_free_mb"] for gpu in chosen),
                  "compute_gpu_count": len(chosen),
                  "ram_total_mb": ram_total_mb,
                  "ram_available_mb": ram_available_mb,
              }

          # Answer GET /hardware
          class HardwareHandler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path.rstrip("/") != "/hardware":
                      self.send_error(404)
                      return
                  body = json.dumps(build_report(read_gpus(), *read_ram())).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, format, *args):
                  pass

          # Serve the hardware report until stopped
          def serve(port = HELPER_PORT):
              server = http.server.ThreadingHTTPServer(("0.0.0.0", port), HardwareHandler)
              server.serve_forever()

          # Run a command by name
          def main(argv):
              if len(argv) == 2 and argv[1] == "select":
                  return 0 if select(read_gpus()) else 1
              if len(argv) == 2 and argv[1] == "serve":
                  serve()
                  return 0
              sys.stderr.write("usage: ollama-helper select|serve\n")
              return 2

          # Start
          if __name__ == "__main__":
              sys.exit(main(sys.argv))

      - path: /etc/systemd/system/ollama-helper.service
        permissions: '0644'
        content: |
          [Unit]
          Description=Hardware report for ollama clients
          After=network-online.target

          [Service]
          ExecStart=/usr/local/sbin/ollama-helper serve
          DynamicUser=yes
          Restart=always

          [Install]
          WantedBy=multi-user.target

    runcmd:
      - [sh, -c, "curl -fsSL https://ollama.com/install.sh | sh"]
      - [systemctl, daemon-reload]
      - [systemctl, enable, --now, ollama]
      - [systemctl, enable, --now, ollama-helper]
      - [ufw, allow, 22/tcp]
      - [ufw, allow, 11434/tcp]
      - [ufw, allow, 11435/tcp]
      - [ufw, --force, enable]

      # First model, so the machine is answering questions when it comes up.
      # Drop this line to leave the choice for later. runcmd has no HOME, which
      # the ollama client refuses to start without.
      - [sh, -c, "export HOME=/root; for i in $(seq 60); do ollama list >/dev/null 2>&1 && break; sleep 2; done; ollama pull llama3.1:8b"]
