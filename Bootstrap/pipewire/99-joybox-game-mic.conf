# Managed by JoyBox Bootstrap (pipewire). Edits are overwritten.
# A silent microphone that Wine and Proton games record from instead of a real
# one; WirePlumber's joybox-game-mic script keeps their streams on it.
context.objects = [
    {
        factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "joybox_game_mic"
            node.description = "Game Mic (silent)"
            media.class      = "Audio/Source/Virtual"
            audio.position   = [ FL FR ]
            priority.session = 0
        }
    }
]
