# Managed by JoyBox Bootstrap (pipewire). Edits are overwritten.
# Wine and Proton games, other than protected apps, may not change the volume
# of any microphone, nor of any output when JoyBox locks outputs too.
pulse.rules = [
    {
        matches = [
            { application.process.binary = "~.*wine.*"${protect} }
            { application.name = "~.*\\.[eE][xX][eE]$"${protect} }
        ]
        actions = { quirks = [ ${quirks} ] }
    }
]
