name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    uses: NearlyTRex/Workflows/.github/workflows/python-ci.yml@e5a738a8e2ec89214d1bad221a81d14732a26842 # v0.2.3
    permissions:
      contents: read
    with:
      # The suite's pytest.ini lives in Tests/; integration tests need external
      # tools and stay local
      test-command: pytest -q -c Tests/pytest.ini Tests/unit
      # Today's floor; raise it as coverage improves, never lower it
      coverage-fail-under: "53"

  lint:
    name: Lint
    uses: NearlyTRex/Workflows/.github/workflows/lint.yml@e5a738a8e2ec89214d1bad221a81d14732a26842 # v0.2.3
    permissions:
      contents: read
