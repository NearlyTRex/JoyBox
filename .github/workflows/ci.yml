name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    uses: NearlyTRex/Workflows/.github/workflows/python-ci.yml@4fe68c91984dd09dea6988fd603b128bc3f44ff7 # v0.2.9
    permissions:
      contents: read
    with:
      # The suite's pytest.ini lives in Tests/; integration tests need programs
      # outside the process and stay local
      test-command: pytest -q -c Tests/pytest.ini Tests/unit
      # Every line and branch is covered; new code needs tests to keep it so
      coverage-fail-under: "100"

  lint:
    name: Lint
    uses: NearlyTRex/Workflows/.github/workflows/lint.yml@4fe68c91984dd09dea6988fd603b128bc3f44ff7 # v0.2.9
    permissions:
      contents: read
