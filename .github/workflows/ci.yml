name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    uses: NearlyTRex/Workflows/.github/workflows/python-ci.yml@c2daac4d6f891b24edb680b073710f4dcd7c9467 # v0.2.2
    permissions:
      contents: read
    with:
      # The suite's pytest.ini lives in Tests/; integration tests need external
      # tools and stay local
      test-command: pytest -q -c Tests/pytest.ini Tests/unit
      # Today's floor; raise it as coverage improves, never lower it
      coverage-fail-under: "48"

  lint:
    name: Lint
    uses: NearlyTRex/Workflows/.github/workflows/lint.yml@c2daac4d6f891b24edb680b073710f4dcd7c9467 # v0.2.2
    permissions:
      contents: read
