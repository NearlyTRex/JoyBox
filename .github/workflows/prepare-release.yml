name: Prepare Release

# Bumps the version and opens a PR. Merging it lets release.yml tag and publish.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: patch, minor, major, or an exact version like 1.4.0
        required: true
        default: patch

permissions: {}

jobs:
  prepare:
    name: Prepare
    uses: NearlyTRex/Workflows/.github/workflows/prepare-release.yml@a1a89468956df5ae1713b94579fec1defc4360a1 # v0.2.16
    permissions:
      contents: write
      pull-requests: write
    with:
      bump: ${{ inputs.bump }}
      version-file: pyproject.toml
