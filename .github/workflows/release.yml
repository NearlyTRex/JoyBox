name: Release

# Tags and publishes the version in pyproject.toml once, after the checks pass.
# Pushes that don't change the version find the tag already there and do nothing.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    name: Check
    uses: NearlyTRex/Workflows/.github/workflows/python-ci.yml@4fe68c91984dd09dea6988fd603b128bc3f44ff7 # v0.2.9
    permissions:
      contents: read
    # The same inputs as the python job in ci.yml
    with:
      test-command: pytest -q -c Tests/pytest.ini Tests/unit
      coverage-fail-under: "100"

  release:
    name: Release
    needs: check
    uses: NearlyTRex/Workflows/.github/workflows/release.yml@4fe68c91984dd09dea6988fd603b128bc3f44ff7 # v0.2.9
    permissions:
      contents: write
    with:
      version-file: pyproject.toml
