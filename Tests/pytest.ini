[pytest]
testpaths = unit integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    requires_binary(*names): skips, before its fixtures run, unless every named program is on PATH ("a|b" takes either)
    requires_tool(*names): skips, before its fixtures run, unless every named JoyBox registry tool is installed
    requires_display: needs a screen to capture
    allow_network: may open outbound connections
    slow: takes more than a second or two

# importlib mode because the tree mirrors the source layout, so unit/ and
# integration/ legitimately contain files with the same basename. The default
# prepend mode derives module names from the basename alone and collides.
# The shell_sandbox and shell_traced_env fixtures come from NearlyTRex/Workflows'
# actions/shell-coverage, which must be on PYTHONPATH; shell coverage itself
# stays off until a --shell-cov option asks for it.
addopts = --strict-markers -ra --import-mode=importlib -p pytest_shell_sandbox -p pytest_shell_cov
