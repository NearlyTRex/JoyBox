[pytest]
testpaths = unit integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# requires_binary, requires_tool and allow_network come from pytest-testrex
markers =
    requires_display: needs a screen to capture
    slow: takes more than a second or two

# importlib mode because the tree mirrors the source layout, so unit/ and
# integration/ legitimately contain files with the same basename. The default
# prepend mode derives module names from the basename alone and collides.
# The shell_sandbox and shell_traced_env fixtures come from pytest-testrex, which
# loads itself; shell coverage stays off until a --shell-cov option asks for it.
addopts = --strict-markers -ra --import-mode=importlib
